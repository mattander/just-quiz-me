name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Cloudflare Web Analytics
        if: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN != '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const token = process.env.CLOUDFLARE_WEB_ANALYTICS_TOKEN

          if (!token || !/^[a-z0-9]{32}$/i.test(token)) {
            throw new Error('CLOUDFLARE_WEB_ANALYTICS_TOKEN must be 32 alphanumeric characters.')
          }

          const configPath = 'wrangler.jsonc'
          const config = fs.readFileSync(configPath, 'utf8')
          fs.writeFileSync(
            configPath,
            config.replaceAll(
              '"PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN": ""',
              `"PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN": "${token}"`,
            ),
          )
          NODE
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
